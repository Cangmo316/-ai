# 比邻AI · Nginx 配置
#
# 放到 /etc/nginx/sites-available/bilin，再软链到 sites-enabled/
#
# ⚠️ 这个配置里最容易被忽略、但一定会出问题的是 **SSE 流式回复**：
#    聊天回复是 server-sent events（`/v1/chat/stream`）。Nginx 默认开启
#    `proxy_buffering`，会把后端一小段一小段的输出**攒起来再一次性发**，
#    表现就是"AI 憋很久、然后整段蹦出来"，流式效果完全失效。
#    必须对这个 location 单独关掉缓冲并延长超时。

upstream bilin_backend {
    # 后端监听 127.0.0.1:8000（systemd 里 HOST 设 127.0.0.1 即可，
    # 对外只通过 Nginx 暴露，后端不直接暴露在公网）
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;          # ← 改成你的域名

    # certbot / acme.sh 的 HTTP-01 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余全部跳 HTTPS（证书签发完成后再打开这段）
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;          # ← 改成你的域名

    # ── 证书（certbot 会自动改这两行）──────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── 安全响应头 ────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 上传：病例图片 / PDF 需要传文件
    client_max_body_size 32m;

    # ── 通用代理设置 ──────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # ⚠️ SSE：聊天流式回复必须单独处理
    #    1) proxy_buffering off       —— 不攒包，来一点发一点
    #    2) proxy_read_timeout 长     —— 老人思考/网络慢时不要中途掐断
    #    3) X-Accel-Buffering: no     —— 双保险（部分 Nginx 版本/上行代理仍会缓冲）
    location = /v1/chat/stream {
        proxy_pass http://bilin_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header X-Accel-Buffering no;
        # SSE 是长连接，禁用 gzip（压缩会让数据留在缓冲区里）
        gzip off;
    }

    # ── 接口 ──────────────────────────────────────────────
    location / {
        proxy_pass http://bilin_backend;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # 后端自带的压缩够用；交给 Nginx 也可以，但 SSE 那条已单独 gzip off
        gzip on;
        gzip_min_length 1024;
        gzip_types application/json text/plain text/css application/javascript;
    }

    # ── 健康检查（不开日志，避免刷屏）────────────────────
    location = /healthz {
        proxy_pass http://bilin_backend;
        access_log off;
    }
}
